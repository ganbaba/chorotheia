[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "chorotheia"
version = "1.2.0"
description = "Local portable agent memory, checkpoints and handoff"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
chorotheia = "chorotheia.__main__:main"

[tool.setuptools.packages.find]
include = ["chorotheia*"]

[project.urls]
Homepage = "https://github.com/ganbaba/chorotheia"
Repository = "https://github.com/ganbaba/chorotheia"
Documentation = "https://github.com/ganbaba/chorotheia/blob/main/docs/OPERATIONS.md"
